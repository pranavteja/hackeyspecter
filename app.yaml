# Databricks Apps manifest for the Hackey Specter Streamlit app.
#
# Reference: https://docs.databricks.com/aws/en/dev-tools/databricks-apps/app-runtime
#
# Two key facts from the runtime spec:
#   1. `command` is a sequence (NOT a shell string). The only env-var
#      expansion performed inside it is `$DATABRICKS_APP_PORT`, which the
#      Databricks runtime substitutes with the actual listening port
#      before executing the command.
#   2. `env` is a list of {name, value} pairs. Env vars defined here are
#      passed straight to the app process. Streamlit reads many of its
#      config keys from env vars (STREAMLIT_SERVER_PORT, etc.).

command:
  - streamlit
  - run
  - app.py
  - --server.port=$DATABRICKS_APP_PORT
  - --server.address=0.0.0.0
  - --server.headless=true
  # On Databricks: $DATABRICKS_APP_PORT is replaced with the real port.
  # Locally:  you must set DATABRICKS_APP_PORT=8000 in your shell,
  #           then `streamlit run app.py --server.port=$DATABRICKS_APP_PORT ...`

env:
  # ---- Streamlit config (also read from env when CLI flags are absent) ----
  - name: STREAMLIT_SERVER_ADDRESS
    value: "0.0.0.0"
  - name: STREAMLIT_SERVER_HEADLESS
    value: "true"
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
  - name: STREAMLIT_GATHER_USAGE_STATS
    value: "false"
  - name: STREAMLIT_THEME_BASE
    value: "light"
  - name: STREAMLIT_CLIENT_TOOLBAR_MODE
    value: "minimal"
  # ---- App-level env vars ----
  # OpenAI key for the LLM-generated "Why you will love this" section.
  # `valueFrom` references a *resource key* (a label you assign when
  # registering the secret as an app resource), NOT the scope/key path.
  #
  # Setup (one-time per workspace):
  #   1. Create the secret scope + key:
  #        databricks secrets create-scope llm-secrets
  #        databricks secrets put-secret --scope llm-secrets --key openai_api_key
  #   2. Register the secret as an app resource (Apps UI → your app →
  #      App resources → + Add resource → Secret → scope=llm-secrets,
  #      key=openai_api_key, permission=Can read, resource key=openai-key)
  #      OR via databricks.yml (see DATABRICKS_DEPLOY.md).
  #   3. Databricks injects the secret value as OPENAI_API_KEY at runtime.
  #
  # The app gracefully falls back to the rule-based explainer when this
  # var is absent (e.g. local dev, or before the resource is registered).
  - name: OPENAI_API_KEY
    valueFrom: openai-key   # resource key assigned when adding the secret resource
  # Optional: override the OpenAI model (defaults to gpt-4o-mini).
  # - name: OPENAI_MODEL
  #   value: "gpt-4o-mini"

# ------------------------------------------------------------
# Unity Catalog volume containing the LibriVox audiobook
# summaries (summary_1to16000.json). The app reads from
# /Volumes/workspace/default/hackey-data at runtime.
#
# Register this volume as an app resource (Apps UI → your app →
# App resources → + Add resource → Volume → catalog=workspace,
# schema=default, volume=hackey-data, permission=Can read,
# resource key=hackey-data) OR keep the resources block below
# if you deploy with a databricks.yml bundle.
# ------------------------------------------------------------
resources:
  - name: hackey-data
    volume:
      catalog_name: workspace
      schema_name: default
      volume_name: hackey-data
